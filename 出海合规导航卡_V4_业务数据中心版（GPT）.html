$('#disclaimer-btn').onclick=()=>modal('使用边界与免责声明',`<p>${Demo.disclaimer}</p><div class="notice">此 Demo 使用预置场景、示例税率及虚构企业案例，没有接入实时政策检索、AI 服务或企业系统。所有“置信度”仅用于演示分级交互。</div><p class="muted small">历史记录与反馈只保存在当前浏览器，不会发送给第三方。</p>`);
const navLabels={new:['edit','新建导航卡'],history:['clock','历史记录'],data:['box','业务数据中心'],guide:['book','演示指南']};
$$('[data-nav]').forEach(b=>{const a=navLabels[b.dataset.nav];b.innerHTML=icon(a[0])+a[1];b.onclick=()=>navigate(b.dataset.nav);});$('.brand').onclick=e=>{e.preventDefault();navigate('new');};
function navigate(page){run++;if(state.page==='input')readForm();if(page==='new'){state.page='input';}else state.page=page;render();window.scrollTo(0,0);}
function steps(current){return `<div class="steps" aria-label="当前流程">${['商品信息','HS 确认','合规分析','导航卡'].map((s,i)=>`<div class="step ${i===current?'current':i<current?'done':''}" ${i===current?'aria-current="step"':''}><span class="num">${i<current?icon('check'):String(i+1).padStart(2,'0')}</span>${s}</div>`).join('')}</div>`;}
function options(list,value){return list.map(([v,l])=>`<option value="${esc(v)}" ${v===value?'selected':''}>${esc(l)}</option>`).join('');}
function inputField(name,label,type='text',placeholder=''){return `<div><label for="${name}">${label}</label><input id="${name}" name="${name}" type="${type}" value="${esc(state.form[name])}" ${type==='number'?'min="0" max="1000000000000" step="0.01"':''} ${type==='date'?'min="2020-01-01" max="2099-12-31"':''} placeholder="${esc(placeholder)}"></div>`;}
function render(){const page=state.page;$$('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===(['input','confirm','loading','result'].includes(page)?'new':page)));$('#breadcrumb').textContent=({input:'新建导航卡',confirm:'商品识别与 HS 确认',loading:'合规分析',result:'出海合规导航卡',history:'历史记录',data:'业务数据中心',guide:'演示指南'})[page];$('#main').innerHTML=`<div class="page animate-in">${({input:inputView,confirm:confirmView,loading:loadingView,result:resultView,history:historyView,data:businessDataView,guide:guideView})[page]()}</div>`;bind();}
function inputView(){const f=state.form;return `<div class="page-intro"><h1>告诉我产品和目的地，AI 帮你梳理出海路径。</h1><p>从商品识别、HS 归类，到合规、税费、交期和历史资源，一张卡辅助业务决策。</p></div>${steps(0)}<div class="input-layout"><section class="panel"><div class="panel-title"><h2>先告诉我两个关键信息</h2><p>目的国 + 产品描述即可开始；货值、交期和物流参数按需补充。</p></div><form id="product-form"><p id="form-error" class="field-error" role="alert"></p><div class="form-grid"><div><label for="country">目的国 / 地区<span class="required">*</span></label><select id="country" name="country">${options(Object.entries(Demo.countries).map(([k,v])=>[k,`${v.flag}  ${v.name} ${v.english}`]),f.country)}</select></div><div><label for="origin">原产国</label><select id="origin" name="origin">${options([['中国','🇨🇳  中国 China'],['越南','🇻🇳  越南 Vietnam'],['其他','其他 / 待确认']],f.origin)}</select></div><div class="full"><label for="product">产品描述<span class="required">*</span></label><textarea id="product" name="product" required maxlength="500" placeholder="例如：18V 无刷充电扳手，用于建筑施工">${esc(f.product)}</textarea><div class="counter"><span id="char-count">${f.product.length}</span>/500</div></div><div class="full"><label for="brand">品牌 / 型号（选填）</label><input id="brand" name="brand" maxlength="100" value="${esc(f.brand)}" placeholder="例如：品牌名称 / 产品型号"></div></div><details class="optional" ${f.value!==''||f.date?'open':''}><summary>货值与交期（选填）</summary><div class="optional-content form-grid">${inputField('value','货值','number','填写后估算税费')}<div><label for="currency">币种</label><select id="currency" name="currency">${options([['USD','USD · 美元'],['CNY','CNY · 人民币'],['EUR','EUR · 欧元']],f.currency)}</select></div><div><label for="mode">日期计算方式</label><select id="mode" name="mode">${options([['backward','要求到货日 → 反算'],['forward','开始备货日 → 正算']],f.mode)}</select></div>${inputField('date',f.mode==='backward'?'要求到货日':'开始备货日','date')}<div class="full field-hint">正算从备货准备开始，另行给出预计交运日。</div></div></details><details class="optional"><summary>高级物流与计税参数</summary><div class="optional-content form-grid">${inputField('from','起运地')}${inputField('to','目的城市 / 港口')}<div><label for="transport">运输方式</label><select id="transport" name="transport">${options([['sea','海运'],['air','空运']],f.transport)}</select></div><div class="field-hint">时效采用演示路线模板；城市修改不触发实时路线查询。</div>${inputField('freight',`国际运费（${f.currency}）`,'number','未填按 0 估算')}${inputField('insurance',`保险费（${f.currency}）`,'number','未填按 0 估算')}</div></details><button class="btn primary full-width" type="submit">AI 开始分析 ${icon('arrow')}</button></form></section><aside class="scenarios"><h2>先试一个业务场景</h2><p>选择以下场景，快速体验生成效果</p><div class="scenarios-list">${Demo.scenarios.map((s,i)=>`<button class="scenario ${state.scenario===i?'selected':''}" data-scenario="${i}">${icon(s.icon)}<span><strong>${s.label}</strong><small>${s.detail}</small></span>${icon('chevron','chevron')}</button>`).join('')}</div><div class="decision"><h3>一张卡，串联四类决策</h3><p>从合规到履约，提供可执行的出海指引</p><div class="decision-grid">${[['shield','准入与认证','市场准入要求与产品认证'],['coins','税费与优惠','关税税率与优惠政策'],['truck','交期与风险','物流时效与合规风险'],['file','案例与供应商','参考案例与优质供应商']].map(x=>`<div class="decision-item">${icon(x[0])}<div><strong>${x[1]}</strong><small>${x[2]}</small></div></div>`).join('')}</div></div></aside></div>`;}
function readForm(){const form=$('#product-form');if(form){for(const [k,v]of new FormData(form))state.form[k]=String(v).trim();}}
function applyScenario(i){state.form={...defaults(),...Demo.scenarios[i],to:Demo.countries[Demo.scenarios[i].country].port};state.attributes={};state.selected='';state.scenario=i;render();toast('已填入场景；点击“开始商品识别”体验完整流程');}
function begin(){readForm();if(!state.form.product.trim()){ $('#form-error').textContent='请填写具体的产品描述，不能仅输入空格。'; $('#product').focus(); return;}state.classification=Core.classify(state.form.product);state.attributes={power:state.classification.power,type:'',chair:''};state.selected='';state.ack=false;state.checklist=[];state.page='confirm';render();window.scrollTo(0,0);}
function question(label,desc,key,items){return `<div class="question"><div class="q-meta">${icon('search')} AI 追问 · 关键属性确认</div><h3>${label}</h3><p>${desc}</p><div class="choices">${items.map(([val,text])=>`<button class="choice ${state.attributes[key]===val?'selected':''}" data-answer="${key}" data-value="${val}" aria-pressed="${state.attributes[key]===val}">${text}</button>`).join('')}</div></div>`;}
function candidates(){if(state.classification.kind==='unknown')return [];if(state.classification.kind==='chair')return Demo.candidates.chair;const p=state.attributes.power;if(p==='manual')return Demo.candidates.manual;if(p==='electric')return Demo.candidates.electric;if(p==='unknown')return [...Demo.candidates.manual.slice(0,1),...Demo.candidates.electric.slice(0,1)];return [];}
function ready(){if(state.classification.kind==='unknown')return true;if(state.classification.kind==='chair')return !!state.attributes.chair;if(!state.attributes.power)return false;return state.attributes.power==='manual'?!!state.attributes.type:true;}
function uncertain(){return state.classification.kind==='unknown'||Object.values(state.attributes).includes('unknown');}
function chosen(){return candidates().find(c=>c.code===state.selected);}
function confirmView(){const c=state.classification,a=state.attributes;let qs='';if(c.kind==='wrench'){qs+=question('这件工具采用哪种动力方式？','手动与电动工具对应不同的 HS 章节，这是首要归类依据。','power',[['manual','手动'],['electric','电动'],['unknown','不确定']]);if(a.power==='manual')qs+=question('扳手的工作端属于哪一种？','开口是否可调节、是否为套筒，会影响下一层级的归类。','type',[['fixed','固定开口'],['adjustable','活动开口'],['socket','套筒'],['unknown','不知道']]);}else if(c.kind==='chair')qs+=question('座椅是否可以转动并调节高度？','仅有脚轮并不等于可转动，需要确认座椅的调节结构。','chair',[['yes','可以转动并调高'],['no','不具备这些结构'],['unknown','不知道']]);else qs=`<div class="notice">${icon('alert')}<div><strong>该商品尚未被演示样例覆盖</strong><p>我们不会为“${esc(state.form.product)}”强行生成 HS 编码。你可以继续生成待复核清单，或返回使用内置场景。</p></div></div>`;
const list=ready()?candidates():[];return `<div class="page-intro"><h1>先把商品认清，再把路径看清。</h1><p>AI 会优先确认真正影响归类的属性；你可以接受、修改或选择“暂不确定”。</p></div>${steps(1)}<div class="confirm-layout"><section class="panel"><div class="section-label">${icon('search')}<h2>AI 商品识别与关键追问</h2><span class="ai-badge">AI 模拟</span></div>${qs}${ready()?`<div class="section-label" style="margin-top:22px"><h2>${list.length?'选择 HS 候选':'人工复核出口'}</h2><span class="chip ${uncertain()?'red':'amber'}">${uncertain()?'低置信 · 待确认':'中置信 · 演示候选'}</span></div>${list.map(x=>`<label class="candidate ${state.selected===x.code?'selected':''}"><input type="radio" name="hs" value="${x.code}" ${state.selected===x.code?'checked':''}><div><code>${x.code}</code><strong>${x.title}</strong><p>${x.en}</p><p>${x.reason}</p></div></label>`).join('')}<div class="notice">${icon('info')}<div>${uncertain()?'属性尚不完整；保留候选，不输出确定税率或税额。':'以上为示例 HS 6 位候选，目的国完整税号及适用范围仍需复核。'}本 Demo 未连接归类数据库。</div></div><label class="check-label"><input id="hs-ack" type="checkbox" ${state.ack?'checked':''}>我已核对商品画像，理解此为演示建议，仍需报关行或专业人员最终确认。</label>`:''}</section><aside><section class="panel"><div class="section-label"><h2>系统识别的商品画像</h2><button class="btn subtle small" data-action="edit">编辑</button></div>${profileRows()}<div class="notice info">${icon('info')}<div>你的选择会保留在导航卡中。归类有分歧时，可随时返回调整商品信息。</div></div></section></aside></div><div class="actions"><button class="btn left" data-action="edit">返回商品信息</button><button class="btn primary" id="generate" ${!ready()||!state.ack||(!state.selected&&c.kind!=='unknown')?'disabled':''}>${uncertain()?'生成待复核导航卡':'确认 HS，生成导航卡'} ${icon('arrow')}</button></div>`;}
function profileRows(){const f=state.form,c=Demo.countries[f.country],a=state.attributes;return [['产品描述',f.product],['目的国',c.flag+' '+c.name],['原产国',f.origin],['品牌 / 型号',f.brand||'未提供'],['动力 / 结构',a.power==='manual'?'手动 · '+({fixed:'固定开口',adjustable:'活动开口',socket:'套筒',unknown:'结构待确认'}[a.type]||'待补充'):a.power==='electric'?'电动':a.chair==='yes'?'转动、可调高度':a.chair==='no'?'非转动调高结构':'待确认']].map(x=>`<div class="profile-row"><span>${x[0]}</span><strong>${esc(x[1])}</strong></div>`).join('');}
function loadingView(){return `${steps(2)}<div class="loading-page"><div class="scan-icon">${icon('globe')}</div><h1>正在串联你的出海路径</h1><p class="muted" style="margin-top:12px">把商品、规则与履约经验，汇成一张导航卡</p><div class="loading-list">${['确认商品属性与 HS 候选','载入预置政策与来源入口','计算税费与物流节点','匹配模拟案例与供应商'].map((x,i)=>`<div class="loading-line ${i<state.progress?'done':''}">${icon(i<state.progress?'check':'clock')} ${x}</div>`).join('')}<div class="progress"><div style="width:${state.progress*25}%"></div></div></div><p class="small muted">演示流程 · 使用预置样例，没有发起实时检索</p><button class="btn subtle" data-action="cancel">返回 HS 确认</button></div>`;}
async function generate(){state.page='loading';state.progress=0;const id=++run;render();window.scrollTo(0,0);for(let i=1;i<=4;i++){await new Promise(r=>setTimeout(r,430));if(id!==run)return;state.progress=i;render();}state.id='NC-'+Date.now().toString(36).toUpperCase();state.createdAt=new Date().toISOString();state.page='result';saveCurrent();render();window.scrollTo(0,0);}
function saveCurrent(){const snapshot=JSON.parse(JSON.stringify({...state,page:'result'}));history=[snapshot,...history.filter(x=>x.id!==state.id)].slice(0,20);persist();}
function metrics(){const f=state.form,c=Demo.countries[f.country];const supported=!uncertain()&&f.origin==='中国'&&!!chosen();const duty=supported?c.duty:null,vat=supported?c.vat:null;const taxes=Core.tax(f,duty,vat);const durations=[7,3,f.transport==='air'?c.air:c.sea,4,2,5];const schedule=Core.schedule(f.date,f.mode,durations);return {c,duty,vat,taxes,schedule,durations};}
function money(n){return Number(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});}
function sectionTitle(letter,title,chip=''){return `<div class="section-label"><span>${letter}</span><h2>${title}</h2>${chip?`<span class="chip amber">${chip}</span>`:''}</div>`;}
function policyRow(symbol,title,text,source,confidence='中置信 · 样例'){return `<div class="policy-row">${icon(symbol)}<div><h4>${title}</h4><p>${text}</p><div class="policy-meta"><span class="chip amber">${confidence}</span><button class="source-link" data-source="${source}">${Demo.sources[source].name} ↗</button><small class="muted">未实时核验</small></div></div></div>`;}
function summaryContent(m){const f=state.form,hs=chosen(),u=uncertain();const hsText=hs?hs.code:'待归类';const tax=m.taxes?money(m.taxes.total)+' '+f.currency:'待补充';const eta=m.schedule?(f.mode==='backward'?m.schedule.start+' 开始备货':m.schedule.end+' 预计到货'):'待补充';const policy=u?'待人工复核':'逐项复核';return `<section class="ai-summary"><div class="ai-summary-head"><div><span class="ai-badge">AI 分析摘要</span><h2 style="margin-top:9px">这次出海，先看这 5 件事</h2><p class="ai-summary-sub">${esc(f.product)} → ${m.c.flag} ${m.c.name} · 结果仅用于业务辅助，不替代专业复核。</p></div><span class="chip ${u?'red':'amber'}">${u?'低置信 · 信息不足':'中置信 · 待复核'}</span></div><div class="summary-grid"><div class="summary-item"><small>HS 归类</small><strong class="${u?'pending':'warn'}">${hsText}</strong></div><div class="summary-item"><small>准入 / 认证</small><strong class="${u?'pending':'warn'}">${policy}</strong></div><div class="summary-item"><small>预计税费</small><strong class="${m.taxes?'ok':'pending'}">${tax}</strong></div><div class="summary-item"><small>交期</small><strong class="${m.schedule?'ok':'pending'}">${eta}</strong></div><div class="summary-item"><small>贸易风险</small><strong class="warn">需关注 · 待核验</strong></div></div><div class="next-actions"><div class="next-action">${icon('check')}<div><strong>先复核商品归类</strong><p>${hs?'确认目的国完整税号及适用范围。':'补充材质、用途、技术参数后再归类。'}</p></div></div><div class="next-action">${icon('shield')}<div><strong>再核对市场准入</strong><p>重点看认证、进口商责任、限制与品牌专项规则。</p></div></div><div class="next-action">${icon('coins')}<div><strong>确认实际成本</strong><p>补齐货值、运费、保险，并核对特别税及目的地费用。</p></div></div><div class="next-action">${icon('truck')}<div><strong>最后确认履约资源</strong><p>参考历史案例与供应商，并向合作方确认文件和交期。</p></div></div></div></section>`;}
function resultView(){const f=state.form,m=metrics(),c=m.c,hs=chosen();return `<div class="result-head"><div><div class="result-meta"><span class="chip teal">${c.flag} ${c.name}</span><span class="chip">${esc(state.id)}</span><span class="chip amber">演示导航卡</span></div><h1>你的出海合规导航卡</h1><p>${esc(f.product)} · ${new Date(state.createdAt).toLocaleString('zh-CN',{hour12:false})} 生成</p></div><div class="toolbar"><button class="btn" data-action="edit">${icon('edit')} 编辑条件</button><button class="btn" data-action="print">${icon('print')} 打印 / PDF</button><button class="btn primary" data-action="export">${icon('download')} 下载导航卡</button></div></div>${summaryContent(m)}<div class="notice no-print">${icon('info')}<div><strong>本页为交互演示，政策、税率及企业资源均为样例。</strong> 来源链接仅是官方复核入口，未对样例结论进行逐条实时核验；税费与交期按下方假设实际计算。</div></div><div class="jump-nav">${[['overview','商品与 HS'],['policies','准入与认证'],['risk','贸易风险'],['tax','税费估算'],['logistics','交期测算'],['resources','案例与供应商'],['sources','参考来源']].map((x,i)=>`<button data-jump="${x[0]}" class="${i===0?'active':''}">${x[1]}</button>`).join('')}</div><div class="result-layout"><div class="result-main"><section class="panel" id="overview">${sectionTitle('A–B','商品识别与 HS 编码',uncertain()?'低置信 · 待人工复核':'中置信 · 待复核')}<div class="info-grid"><div><span>目的国</span>${c.flag} ${c.name}</div><div><span>原产国</span>${esc(f.origin)}</div><div><span>品牌 / 型号</span>${esc(f.brand||'未提供')}</div><div><span>归类状态</span>${hs?'用户已选示例候选':'未识别，需人工归类'}</div></div><div class="hs-block"><div class="hs-code">${hs?hs.code:'待归类'}</div><div><h3>${hs?hs.title:'未覆盖的商品类别'}</h3><p>${hs?hs.en:'提供商品说明、材质、用途及技术参数后再行归类。'}</p><p>${hs?'HS 6 位示例 · 需核对目的国完整税号':'不会套用其他商品的税号或税率'}</p></div></div><p class="small muted" style="margin-top:13px">${hs?hs.reason:'建议联系报关行进行归类复核。'} ${uncertain()?'当前属性不确定，金额估算暂不输出。':''}</p><div class="brand-check"><strong>品牌 / 产品专项检查</strong><p>${f.brand?`当前已录入品牌“${esc(f.brand)}”。正式版可基于品牌 + 品类 + 目的国检索公开监管信息、授权 / 知识产权要求，并展示对应官方来源。`:'尚未提供品牌 / 型号。若品牌可能影响授权、知识产权或目的国专项规则，建议补充后再分析。'}</p><div class="confidence-help">正式版建议同时展示：信息来源、发布日期 / 核验时间、置信度及“为什么需要人工复核”。</div></div></section><section class="panel" id="policies">${sectionTitle('C–D','进口准入与认证','逐项复核')}${policyContent(m)}</section><section class="panel" id="risk">${sectionTitle('E','国别宏观与贸易风险','演示框架 · 待核验')}<div class="trade-risk-head"><div><h3 style="margin:0 0 6px">贸易风险扫描</h3><p class="small muted" style="margin:0">围绕“跨境资金能否顺利流动、商品能否顺利进入”两条主线，对目的国宏观环境和贸易红线进行结构化检查。</p></div><span class="trade-risk-badge">${icon('alert')} ${tradeRiskStatus(m)}</span></div>${tradeRiskContent(m)}</section><section class="panel" id="tax">${sectionTitle('E–F','税费与优惠估算','示例税率')}<div class="rate-line"><span>关税 <b>${m.duty==null?'待确认':(m.duty*100).toFixed(1)+'%'}</b></span><span>进口 VAT <b>${m.vat==null?'待确认':(m.vat*100).toFixed(0)+'%'}</b></span><span>优惠税率 <b>未采用</b></span></div><p class="small muted" style="margin-top:9px">税率核验时间：未核验 · 仅演示公式，不作为现行税则</p><form id="tax-form"><div class="calc-form">${inputField('calc-value',`货值（${f.currency}）`,'number').replace('value=""',`value="${esc(f.value)}"`)}${inputField('calc-freight',`国际运费（${f.currency}）`,'number').replace('value=""',`value="${esc(f.freight)}"`)}${inputField('calc-insurance',`保险费（${f.currency}）`,'number').replace('value=""',`value="${esc(f.insurance)}"`)}</div><button class="btn small" type="submit">重新计算税费 ${icon('arrow')}</button></form>${taxContent(m)}<div class="formula">计算口径：完税价格 = 货值 + 国际运费 + 保险费；关税 = 完税价格 × 关税率；进口 VAT =（完税价格 + 关税）× VAT 税率。全部金额使用 ${f.currency}，不进行汇率换算。<br>特别税、反倾销税、消费税及目的地费用未计入，是否适用需另行核验。优惠情景缺少原产地与协议依据，暂不计算。<br>${f.freight===''||f.insurance===''?'未填写的运费 / 保险按 0 估算，金额可能低估。':''}</div><div class="policy-meta" style="margin-top:13px"><span class="chip amber">低置信 · 未核验税率</span><button class="source-link" data-source="${c.sources[0]}">查看税则复核入口 ↗</button></div></section><section class="panel" id="logistics">${sectionTitle('G','交期测算','模板估算')}<p class="small muted">${esc(f.from)} → ${esc(f.to)} · ${f.transport==='air'?'空运':'海运'} · 使用${c.name}国家级演示模板，城市未参与路线计算</p><form id="schedule-form"><div class="calc-form"><div><label for="calc-mode">计算方式</label><select id="calc-mode">${options([['backward','要求到货日 → 反算'],['forward','开始备货日 → 正算']],f.mode)}</select></div><div><label for="calc-date">${f.mode==='backward'?'要求到货日':'开始备货日'}</label><input id="calc-date" type="date" min="2020-01-01" max="2099-12-31" value="${f.date}"></div><div><label for="calc-transport">运输方式</label><select id="calc-transport">${options([['sea','海运'],['air','空运']],f.transport)}</select></div></div><button class="btn small" type="submit">更新交期测算 ${icon('arrow')}</button></form>${scheduleContent(m)}<div class="formula">按日历天连续计算，已包含 5 天安全缓冲；未考虑节假日、船期取消、查验、认证办理或危险品限制。含电池货物需先核对可用运输方式。模板置信度：低；时效未实时核验。</div></section><section class="panel" id="resources">${sectionTitle('H–I','历史案例与供应商','全部为虚构样例')}${resourceContent(m)}</section><section class="panel" id="sources">${sectionTitle('J','参考来源与使用边界')}<p class="small muted">以下是官方查询入口，不是样例结论的已核验依据。</p>${c.sources.map(k=>`<div class="source-row">${icon('globe')}<div><strong>${Demo.sources[k].name}</strong><p>${Demo.sources[k].scope} · 未核验</p></div><button class="btn small" data-source="${k}">来源详情 ${icon('external')}</button></div>`).join('')}<p class="small muted" style="margin-top:17px">${Demo.disclaimer}</p><button class="btn subtle small" data-action="feedback">信息有误？提交演示反馈 ${icon('arrow')}</button></section></div><aside class="result-aside"><section class="panel"><h3>这次出海，下一步做什么</h3><div class="notice ${uncertain()?'':'info'}">${icon('shield')}<div><strong>${uncertain()?'优先完成商品归类':'先复核，再推进'}</strong><br>样例结果不能代替准入结论</div></div><div class="aside-kpi"><small>预计税费小计 · ${f.currency}</small><strong>${m.taxes?money(m.taxes.total):'待补充 / 待确认'}</strong><small>不含特别税及其他目的地费用</small></div><h4>出海准备清单</h4>${['复核 HS 编码与目的国税号','完成国别贸易风险核验','确认认证及进口商责任','补齐运保费与原产地材料','向供应商核实交期与文件'].map((x,i)=>`<label class="todo"><input type="checkbox" data-todo="${i}" ${state.checklist.includes(i)?'checked':''}>${x}</label>`).join('')}<p class="aside-caption">清单仅保存在本地浏览器。<br>政策核验：尚未进行<br>企业数据：虚构演示</p><button class="btn full-width" data-action="review">申请人工复核 ${icon('arrow')}</button></section><button class="btn subtle small" style="margin-top:12px" data-action="fresh">${icon('plus')} 再建一张导航卡</button></aside></div><p class="print-only">演示数据、未实时核验。${Demo.disclaimer}</p>`;}

function tradeRiskStatus(m){return '需关注 · 待核验';}
function tradeRiskContent(m){
 const f=state.form,c=m.c;
 const items=[
  ['coins','货币政策','关注利率、通胀与汇率波动对报价、结算周期及回款成本的影响。','跨境资金风险','attention'],
  ['globe','外汇管制','核验外汇收付、结汇、购汇、利润汇出及进口付款是否存在主体或用途限制。','跨境资金风险','attention'],
  ['shield','进口监管政策','核验进口许可、配额、产品注册、进口商资质及海关监管要求。','进口准入风险','attention'],
  ['file','政策透明度','关注政策是否有明确官方发布渠道、实施日期、过渡期及稳定的查询入口。','政策变化风险','attention'],
  ['alert','贸易红线','检查制裁、禁限运、出口管制、反倾销/反补贴及敏感品类等风险项。','交易阻断风险','attention']
 ];
 return `<div class="trade-risk-grid">${items.map(x=>`<div class="trade-risk-card"><div class="risk-icon">${icon(x[0])}</div><strong>${x[1]}</strong><small>${x[2]}</small><span class="risk-status ${x[4]}">${x[3]} · 待核验</span></div>`).join('')}</div><div class="risk-actions"><div class="risk-action"><h4>${icon('coins')} 跨境资金风险</h4><p>正式版根据目的国央行、外汇管理机构、银行结算规则及最新政策，判断付款、结汇、回款和利润汇出环节的潜在限制，并提示需要提前确认的材料。</p></div><div class="risk-action"><h4>${icon('shield')} 进口准入风险</h4><p>正式版结合海关、贸易主管部门及产品监管机构公开规则，检查禁限入、许可、配额、注册、进口商责任等“贸易红线”。</p></div></div><div class="notice" style="margin-top:14px">${icon('info')}<div><strong>演示说明：</strong>当前风险模块仅展示分析框架和交互方式，没有接入实时宏观数据、外汇监管数据库、制裁/贸易管制数据库或实时政策检索，因此不会对 ${esc(f.country)} 形成真实风险评级。正式版建议输出“风险项 → 事实依据 → 官方来源 → 更新时间 → 风险影响 → 建议动作”的证据链。</div></div><div class="risk-foot">建议正式版重点接入：当地央行 / 外汇管理机构、海关与贸易主管部门、财政/税务机构、官方法规数据库及公司内部贸易红线规则。${c.sources?.length?' 当前 Demo 可继续沿用已有官方来源入口作为页面跳转框架。':''}</div>`;
}
function policyContent(m){const src=m.c.sources;if(uncertain())return policyRow('alert','商品属性未确认，暂不判断准入','请先完成 HS 与属性复核。以下官方入口可用于后续核对，当前不生成确定的准入、认证或品牌专项结论。',src[0],'低置信 · 待归类');const electric=state.attributes.power==='electric',chair=state.classification.kind==='chair';return policyRow('shield','进口限制与许可 · 待核对',`演示检索项：以最终税号、${esc(state.form.origin)}原产地、用途及进口主体核对禁止 / 限制清单、许可证和配额。未实时检索，不能据此判定“允许进口”。`,src[0])+policyRow('file',electric?'电气安全、EMC 与电池运输 · 适用性待确认':chair?'结构安全、材质及标签 · 适用性待确认':'产品安全、标签与技术资料 · 适用性待确认',electric?'样例检查项：产品安全与电磁兼容资料；如含锂电池，核对运输试验报告与包装要求。强制性及适用范围须向监管机构确认。':'样例检查项：产品说明、材质或结构资料、标签与进口商信息；不能仅凭产品名称判定强制认证。',src[1])+policyRow('globe','进口商 / 本地代理与品牌专项规则','进口主体、本地责任主体是否必需及品牌授权 / 知识产权要求均待复核。未提供完整型号或授权资料时不作确定判断。',src[1],'低置信 · 信息待补充');}
function taxContent(m){if(!m.taxes)return `<div class="notice">${icon('info')}<div>${m.duty==null?'HS 属性或原产国未在样例范围内，暂不输出确定税额。完成专业复核后再计算。':'尚未提供货值，填写金额后即可查看演示估算。'}</div></div>`;return `<div class="number-grid"><div class="number"><small>关税 · ${state.form.currency}</small><strong>${money(m.taxes.duty)}</strong></div><div class="number"><small>进口 VAT · ${state.form.currency}</small><strong>${money(m.taxes.vat)}</strong></div><div class="number"><small>税费小计 · ${state.form.currency}</small><strong>${money(m.taxes.total)}</strong></div></div><p class="small muted" style="margin-bottom:14px">演示完税价格：${state.form.currency} ${money(m.taxes.base)} · 货值 + 运保费 + 已估税费：${money(m.taxes.landed)}</p>`;}
function scheduleContent(m){const s=m.schedule;if(!s)return `<div class="notice info">${icon('clock')}<div>尚未提供日期。选择到货日可反推最晚启动时间，选择开始备货日可预计到货日期。</div></div>`;const today=new Date().toLocaleDateString('en-CA'),past=s.start<today;return `<div class="schedule-head"><div><small class="muted">${state.form.mode==='backward'?'最晚开始备货':'预计到货日期'}</small><br><strong>${state.form.mode==='backward'?s.start:s.end}</strong></div><span class="chip ${past?'red':'teal'}">${past?'计划窗口已过':'模板内正常'} · 共 ${s.total} 天</span></div><p class="small muted" style="margin-top:7px">${state.form.mode==='backward'?'最晚交运':'预计交运'}：${s.dispatch}　|　到货：${s.end}</p><div class="timeline">${s.nodes.map((n,i)=>`<div class="timeline-item"><strong>${Demo.stages[i]}</strong><b>${n.days} 天</b><span>${n.from.slice(5)} → ${n.to.slice(5)}</span></div>`).join('')}</div>${past?'<div class="notice">最晚启动日期已早于今天，请调整到货日或核实更快的运输方案。</div>':''}`;}
function businessMatches(){const country=Demo.countries[state.form.country]?.name||state.form.country;const product=state.form.product.toLowerCase();return businessData.filter(r=>{const c=String(r['目的国']||'').toLowerCase();const cat=String(r['产品品类']||'').toLowerCase();const desc=String(r['产品名称/描述']||'').toLowerCase();const hs=String(r['HS CODE']||'');return (!c||c.includes(country.toLowerCase())||country.toLowerCase().includes(c)) && (cat.includes(product)||product.includes(cat)||desc.includes(product)||desc.split(/[，,；;\s]+/).some(k=>k.length>1&&product.includes(k))||(!state.selected||hs===state.selected));}).slice(0,8);}
function resourceContent(m){const matched=businessMatches();if(matched.length)return `<p class="small muted">以下内容来自已导入的内部业务数据，与当前目的国 / 商品信息做规则匹配。正式版可进一步接企业主数据与项目系统。</p>${matched.map((r,i)=>`<div class="case-row"><div class="case-icon">${icon('box')}</div><div><h4>${esc(r['产品品类']||'历史合作品类')} · ${esc(r['目的国']||'')}</h4><p>HS ${esc(r['HS CODE']||'待补充')} · 供应商：${esc(r['合作供应商/厂家']||'待补充')} · ${esc(r['合作状态']||'历史合作')}</p><p class="small muted">关税 ${esc(r['关税率']||'待补充')} · 退税 ${esc(r['是否退税']||'待补充')} · 区域 ${esc(r['合作区域/国家']||r['目的国']||'')}</p></div></div>`).join('')}<div class="notice">${icon('info')}<div>共匹配 ${matched.length} 条内部业务记录。内部数据仅作为业务参考，仍需结合当前产品属性与最新政策复核。</div></div>`;if(state.classification.kind==='unknown')return `<div class="empty" style="padding:25px 0">${icon('box')}<h3>尚无该品类的演示案例</h3><p>保留空结果，避免推荐不相关供应商。</p><a class="btn" href="https://zyzq.yzw.cn/hwzq/search-supplier" target="_blank" rel="noopener noreferrer">前往云筑海外专区 ${icon('external')}</a></div>`;const kind=state.classification.kind==='chair'?'办公家具':'五金工具';return `<p class="small muted">按品类与区域进行规则匹配；项目、企业名称均为虚构，客户信息已用占位符脱敏。</p><div class="case-row"><div class="case-icon">${icon('file')}</div><div><h4>${m.c.name} · ${kind}交付项目（样例）</h4><p>示例客户 A · 同国别 / 同品类 · 履约经验演示</p></div><button class="btn small" data-resource="case">查看案例</button></div><div class="case-row"><div class="case-icon">${icon('box')}</div><div><h4>${kind==='办公家具'?'示例 · 华远办公家具':'示例 · 远航工具制造'}</h4><p><span class="chip teal">已合作 · 模拟</span> ${kind} · 可提供出口资料</p></div><button class="btn small" data-resource="supplier">供应商详情</button></div><div class="case-row"><div class="case-icon">${icon('search')}</div><div><h4>发现更多供应商</h4><p>云筑海外专区公开入口 · 未接入搜索接口</p></div><a class="btn small" href="https://zyzq.yzw.cn/hwzq/search-supplier" target="_blank" rel="noopener noreferrer">前往专区 ${icon('external')}</a></div>`;}
function historyView(){return `<div class="result-head"><div><h1>历史记录</h1><p>保留最近 20 张导航卡，仅存于当前浏览器。</p></div><button class="btn primary" data-action="fresh">${icon('plus')} 新建导航卡</button></div><section class="panel">${history.length?history.map((h,i)=>`<div class="history-row"><span style="font-size:27px">${Demo.countries[h.form.country].flag}</span><div><strong>${esc(h.form.product)}</strong><p>${Demo.countries[h.form.country].name} · ${esc(h.selected||'待归类')} · ${new Date(h.createdAt).toLocaleString('zh-CN',{hour12:false})}</p></div><span class="chip amber">演示</span><button class="btn small" data-history="${i}">打开导航卡 ${icon('arrow')}</button><button class="icon-button" data-delete="${i}" aria-label="删除此历史记录">×</button></div>`).join(''):`<div class="empty">${icon('clock')}<h3>你的第一条出海路径，从这里开始</h3><p>生成导航卡后，将自动保存到这里。</p><button class="btn primary" data-action="fresh">新建导航卡 ${icon('arrow')}</button></div>`}</section>`;}
function guideView(){return `<div class="page-intro"><h1>四步，体验完整的出海决策。</h1><p>为创新比赛与产品评审准备的轻量演示工作台。</p></div><div class="guide-grid">${[['01','输入商品，轻量开始','选择目的国并描述商品。货值、交期和物流参数按需填写；使用首页场景可以快速体验。'],['02','关键追问，确认 HS','“德国＋扳手”会追问手动 / 电动及结构；不知道也可继续，但会降低置信度并保留候选。'],['03','一张卡，看到业务价值','查看 A–J 结构化模块。税费支持运保费修改，交期支持海运 / 空运及日期正反算。'],['04','复核、留存与反馈','查看官方查询入口，勾选准备清单，下载离线导航卡，或通过浏览器打印为 PDF。历史与反馈只存本地。']].map(x=>`<section class="panel"><div class="num">${x[0]}</div><h3>${x[1]}</h3><p>${x[2]}</p></section>`).join('')}</div><div class="notice">${icon('info')}<div><strong>演示范围</strong><br>3 个目的国：德国、阿联酋、沙特；3 类典型商品：手动扳手、电动工具、办公椅。未接入 AI / RAG、实时政策、内部企业系统、联系人或在线反馈服务。业务数据中心支持 CSV 导入演示；正式版可接 Excel、数据库或内部系统。样例展示交互，不代表业务事实。</div></div><button class="btn primary" data-action="fresh">开始体验 ${icon('arrow')}</button>`;}
function showSource(key){const s=Demo.sources[key];modal(s.name,`<span class="chip">官方机构查询入口</span><div class="profile-row"><span>发布机构</span><strong>${s.agency}</strong></div><div class="profile-row"><span>参考范围</span><strong>${s.scope}</strong></div><div class="profile-row"><span>最近核验</span><strong>未实时核验</strong></div><div class="notice">本 Demo 未抓取或核验该网站中的具体条款。页面展示的政策、税率与置信度为样例，不能将此链接理解为对样例结论的背书。</div><a class="btn primary" href="${s.url}" target="_blank" rel="noopener noreferrer">打开官方入口 ${icon('external')}</a><p class="small muted">打开后请按原产国、目的国、完整税号及日期查询。</p>`);}
function feedback(review=false){modal(review?'申请人工复核（演示）':'反馈纠错（演示）',`<form id="feedback-form"><label for="feedback-type">${review?'复核事项':'反馈类型'}</label><select id="feedback-type">${options([['HS','HS 归类不准 / 待确认'],['policy','政策或认证适用范围'],['tax','税率 / 计税口径'],['other','其他信息']],review?'HS':'policy')}</select><label for="feedback-text" style="margin-top:16px">补充说明</label><textarea id="feedback-text" required maxlength="1000" placeholder="描述需要核对的商品属性、条款或计算条件"></textarea><p class="small muted">仅保存到当前浏览器，不会发送给专家或其他人员。</p><button class="btn primary" type="submit">保存${review?'复核请求':'反馈'}到本地</button></form>`);$('#feedback-form').onsubmit=e=>{e.preventDefault();const item={card:state.id,type:$('#feedback-type').value,text:$('#feedback-text').value.trim(),at:new Date().toISOString()};if(!item.text)return $('#feedback-text').setCustomValidity('请填写说明');try{let arr=JSON.parse(localStorage.getItem('compass-demo-feedback')||'[]');if(!Array.isArray(arr))arr=[];localStorage.setItem('compass-demo-feedback',JSON.stringify([...arr,item]));$('#modal').close();toast('已保存在本地；未发送给外部人员');}catch{toast('浏览器不允许本地保存，请复制说明自行留存');}};$('#feedback-text').oninput=e=>e.target.setCustomValidity('');}
function exportCard(){const clone=$('#main').cloneNode(true);clone.querySelectorAll('button,form,.jump-nav,.result-aside,.toolbar,.no-print').forEach(x=>x.remove());clone.querySelectorAll('input').forEach(x=>x.remove());const css=$('style').textContent;const html=`<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>出海合规导航卡 ${esc(state.id)}</title><style>${css}\n.result-layout{display:block}.page{padding:35px;max-width:1050px}.print-only{display:block}.disclaimer{position:static}</style><body><div class="notice" style="margin:20px 35px">已导出的只读演示快照 · 政策和税率未经实时核验 · ${esc(state.id)}</div>${clone.innerHTML}<div style="padding:0 35px 35px"><h3>官方复核入口</h3>${Demo.countries[state.form.country].sources.map(k=>`<p><a href="${Demo.sources[k].url}" target="_blank" rel="noopener noreferrer">${Demo.sources[k].name}</a> · 未实时核验</p>`).join('')}</div></body></html>`;const url=URL.createObjectURL(new Blob([html],{type:'text/html;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=`出海合规导航卡_${state.id}.html`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('已发起下载；若无下载提示，请用 Chrome / Safari 打开本 HTML 后重试');}
function bind(){
if($('#business-file'))$('#business-file').onchange=e=>{const f=e.target.files?.[0];if(!f)return;const reader=new FileReader();reader.onload=()=>{try{const rows=csvParse(String(reader.result||''));if(!rows.length)throw new Error('文件没有有效数据');const headers=rows[0].map(x=>x.trim());const missing=['产品品类','目的国','HS CODE'].filter(h=>!headers.includes(h));if(missing.length)throw new Error('缺少字段：'+missing.join('、'));const imported=rows.slice(1).filter(r=>r.some(x=>x.trim())).map(r=>{const o={};headers.forEach((h,i)=>o[h]=(r[i]||'').trim());return o;});businessData=[...businessData,...imported];persistBusinessData();render();toast(`成功导入 ${imported.length} 条业务数据`);}catch(err){toast(err.message||'导入失败');}};reader.readAsText(f,'UTF-8');};
$$('[data-action="download-template"]').forEach(b=>b.onclick=()=>{const csv='\ufeff'+csvExport([DATA_HEADERS,['电动工具','18V无刷充电扳手','德国','中国','8467.29','0.025','否','0.19','示例供应商A','德国','示例项目A','已合作','示例数据','','内部业务数据']]);const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='出海合规导航卡_业务数据导入模板.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('已下载 CSV 模板，可用 Excel 打开填写');});
$$('[data-action="clear-business"]').forEach(b=>b.onclick=()=>{if(confirm('确定清空当前浏览器中的业务演示数据？')){businessData=[];persistBusinessData();render();toast('业务数据已清空');}});
$$('[data-scenario]').forEach(b=>b.onclick=()=>applyScenario(Number(b.dataset.scenario)));
if($('#product-form')){$('#product-form').onsubmit=e=>{e.preventDefault();begin();};$('#product').oninput=e=>{$('#char-count').textContent=e.target.value.length;$('#form-error').textContent='';};$('#country').onchange=e=>{$('#to').value=Demo.countries[e.target.value].port;};$('#mode').onchange=e=>{$('label[for="date"]').textContent=e.target.value==='backward'?'要求到货日':'开始备货日';};$('#currency').onchange=e=>{$('label[for="freight"]').textContent=`国际运费（${e.target.value}）`;$('label[for="insurance"]').textContent=`保险费（${e.target.value}）`;};}
$$('[data-answer]').forEach(b=>b.onclick=()=>{state.attributes[b.dataset.answer]=b.dataset.value;state.ack=false;if(b.dataset.answer==='power')state.attributes.type='';state.selected='';if(ready()){let list=candidates();let code=list[0]?.code||'';if(state.attributes.type==='adjustable')code='8204.12';if(state.attributes.type==='socket')code='8204.20';if(state.attributes.chair==='no')code='9401.71';state.selected=code;}render();});
$$('input[name="hs"]').forEach(b=>b.onchange=()=>{state.selected=b.value;state.ack=false;render();});if($('#hs-ack'))$('#hs-ack').onchange=e=>{state.ack=e.target.checked;$('#generate').disabled=!ready()||!state.ack||(!state.selected&&state.classification.kind!=='unknown');};if($('#generate'))$('#generate').onclick=()=>generate();
$$('[data-source]').forEach(b=>b.onclick=()=>showSource(b.dataset.source));$$('[data-jump]').forEach(b=>b.onclick=()=>{$$('[data-jump]').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('#'+b.dataset.jump).scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth',block:'start'});});
if($('#tax-form'))$('#tax-form').onsubmit=e=>{e.preventDefault();const data={value:$('#calc-value').value,freight:$('#calc-freight').value,insurance:$('#calc-insurance').value};try{Core.tax(data,.05,.19);Object.assign(state.form,data);saveCurrent();const y=window.scrollY;render();window.scrollTo(0,y);toast('税费已按新参数重算');}catch(err){toast(err.message);}};
if($('#schedule-form')){$('#calc-mode').onchange=e=>$('label[for="calc-date"]').textContent=e.target.value==='backward'?'要求到货日':'开始备货日';$('#schedule-form').onsubmit=e=>{e.preventDefault();Object.assign(state.form,{mode:$('#calc-mode').value,date:$('#calc-date').value,transport:$('#calc-transport').value});saveCurrent();const y=window.scrollY;render();window.scrollTo(0,y);toast('交期与安全缓冲已更新');};}
$$('[data-todo]').forEach(b=>b.onchange=()=>{state.checklist=$$('[data-todo]:checked').map(x=>Number(x.dataset.todo));saveCurrent();});
$$('[data-history]').forEach(b=>b.onclick=()=>{state=JSON.parse(JSON.stringify(history[Number(b.dataset.history)]));state.page='result';state.checklist=state.checklist||[];render();window.scrollTo(0,0);});
$$('[data-delete]').forEach(b=>b.onclick=()=>{const i=Number(b.dataset.delete),removed=history[i];modal('删除本地历史记录',`<p>将移除“${esc(removed.form.product)}”的浏览器记录。已下载的文件不受影响。</p><button class="btn primary" id="confirm-delete">删除此记录</button>`);$('#confirm-delete').onclick=()=>{history.splice(i,1);persist();$('#modal').close();render();toast('已删除本地记录');};});
$$('[data-resource]').forEach(b=>b.onclick=()=>{const isCase=b.dataset.resource==='case';modal(isCase?'同类履约案例（虚构样例）':'供应商档案（虚构样例）',isCase?`<span class="chip amber">模拟内部数据 · 客户已脱敏</span><p><strong>${metrics().c.name} · ${state.classification.kind==='chair'?'办公家具':'五金工具'}交付项目</strong></p><div class="profile-row"><span>客户 / 项目</span><strong>示例客户 A / 项目 ***</strong></div><div class="profile-row"><span>匹配依据</span><strong>相同目的国、相近品类</strong></div><p class="small muted">演示经验：提前核实目的地文件、标签与进口商资料；样例计划中的清关阶段预留 4 天。</p><div class="notice">该项目没有对应真实履约记录，不应用于公司业绩或信用判断。</div>`:`<span class="chip teal">已合作（模拟）</span><p><strong>${state.classification.kind==='chair'?'示例 · 华远办公家具':'示例 · 远航工具制造'}</strong></p><div class="profile-row"><span>可配合资料</span><strong>产品规格、装箱信息、出口文件</strong></div><div class="profile-row"><span>联系方式</span><strong>演示未提供真实联系人</strong></div><p class="small muted">正式版可按企业权限展示采购负责人和历史评价。</p><a class="btn" href="https://zyzq.yzw.cn/hwzq/search-supplier" target="_blank" rel="noopener noreferrer">前往云筑海外专区 ${icon('external')}</a>`);});
$$('[data-action]').forEach(b=>b.onclick=()=>{switch(b.dataset.action){case'edit':run++;state.page='input';render();window.scrollTo(0,0);break;case'cancel':run++;state.page='confirm';render();break;case'fresh':run++;state={page:'input',form:defaults(),attributes:{},selected:'',ack:false,checklist:[],scenario:-1};render();window.scrollTo(0,0);break;case'print':window.print();break;case'export':exportCard();break;case'feedback':feedback();break;case'review':feedback(true);break;}});
}
render();
})();
</script></body></html>
